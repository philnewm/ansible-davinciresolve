---

state: present

dresolve_version: "20.3.1"
dresolve_studio: false

# Note also works for local files file:///tmp/a_file.txt
# https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/get_url_module.html#examples
dresolve_installer_src: "/path/to/installer"
dresolve_installer: "DaVinci_Resolve_{{ 'Studio_' if dresolve_studio else '' }}{{ dresolve_version }}_Linux.run"

dresolve_package_dir: "/tmp/resolve"
installer_path: "{{ dresolve_package_dir }}/{{ dresolve_installer }}"
dresolve_install_location: "/opt/resolve/{{ dresolve_version }}"

dresolve_openfx_renderer: true
dresolve_executable_path: "{{ dresolve_install_location }}/bin/resolve"
dresolve_symlink: "/usr/local/bin/resolve"

dresolve_pipeline_dev: true
dresolve_venv_path: "/etc/skel/python_venv/dresolve_venv"
dresolve_venv_dependencies:
  redhat:
    - python3-packaging
  debian:
    - python3-packaging
    - python3-venv
dresolve_python_modules:
  - fusionscript-stubs

...
